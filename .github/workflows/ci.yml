name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CI: true

jobs:
  astro-blog:
    name: Lint and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep pnpm/action-setup for pnpm@10.13.1; pnpm/setup requires pnpm 11+.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test workspace cleanup
        run: pnpm test:clean

      - name: Lint astro-blog
        run: pnpm --filter astro-blog lint

      - name: Check astro-blog
        run: pnpm --filter astro-blog check

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(pnpm --filter astro-blog exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Set up Playwright Chromium
        run: pnpm --filter astro-blog run setup:e2e

      - name: Run Playwright E2E
        run: pnpm --filter astro-blog test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            apps/astro-blog/test-results
            apps/astro-blog/playwright-report
